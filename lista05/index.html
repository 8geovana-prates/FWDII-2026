<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <title>Tabela de Cadastros | Index</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
   
  </head>
  <body>
    <form>
      <label for="cod"></label>
      Código:<input type="text" id="cod"><br>
      <label for="nome"></label>
      Nome:<input type="text" id="nome"><br>
      <label for="tel"></label>
      Telefone:<input type="text" id="tel"><br>
      <label for="email"></label>
      Email:<input type="text" id="email"><br>
      <button type="button" id="btnSalvar">Salvar</button>
      <button type="button" id="btnOrderCod">Ordenar por código</button><br>
      <button type="button" id="btnOrderName">Ordenar por nome</button><br>
    </form>
    <table id="demo">
    <thead>
    <tr>
    <td id="01">Código</td>
    <td id="02">Nome</td>
    <td id="03">Telefone</td>
    <td id="04">Email</td>
    <td id="05">Ações</td>
    </tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
    </table>
     <script src="script.js"></script>
  </body>
</html>
